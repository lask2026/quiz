services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - /home/ubuntu/study-library:/app/library:ro
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/chemistry_quiz
    depends_on:
      - mongo
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STUDY_USERNAME: ${STUDY_USERNAME}
      STUDY_PASSWORD_HASH: ${STUDY_PASSWORD_HASH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
volumes:
  mongodb-data:
  caddy-data:
  caddy-config:
